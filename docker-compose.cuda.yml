# GPU: собирается из Dockerfile.cuda (PyTorch CUDA). Инференс/прод — обычный Dockerfile (CPU slim).
services:
  cvc-api:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - BATCH_SIZE=128
