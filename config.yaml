# Конфигурация API сервера для CVC

# Настройки сервера
server:
  host: "0.0.0.0"
  port: 20001

# Настройки модели
model:
  # Путь к сохраненной обученной модели
  path: "models/panda_commands"
  # Базовая модель для обучения (если модель не найдена)
  name: "google/embeddinggemma-300M"
  # Порог уверенности для классификации
  confidence_threshold: 0.5
  # Путь для кэширования базовой модели (опционально, по умолчанию используется системный кэш)
  cache_dir: "models/.cache"

# Настройки базы данных
database:
  # Путь к SQLite базе данных
  # В Docker используется db/training_data.db
  path: "db/training_data.db"
  # Путь к CSV файлу или директории с CSV файлами для автоматической миграции (опционально)
  # Если указана директория, загружаются все CSV файлы из неё
  csv_migration_path: "data"

# Параметры обучения по умолчанию
# Можно переопределить через HTTP API /train endpoint
training:
  iterations: 20
  epochs: 1
  batch_size: 32
  learning_rate: 2e-5



