name: ML Pipeline - Train and Deploy

on:
  push:
    branches: [ main, master, dev ]  # Триггер на push в main/master/dev (новый датасет)
  workflow_dispatch:  # Позволяет запускать вручную через GitHub UI
    inputs:
      db_path:
        description: 'Путь к базе данных для обучения (относительно корня проекта, по умолчанию: db/training_data_ci.db)'
        required: false
        default: 'db/training_data_ci.db'
        type: string

jobs:
  test:
    name: Run tests in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create network for Docker Compose
        run: |
          docker network create robot-services-network 2>/dev/null || true

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Build image
        run: |
          docker compose build --no-cache cvc-api

      - name: Run tests in container
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          docker compose run --rm cvc-api pytest tests/ -v --tb=short --cov=commands_classifier --cov-report=term-missing

  train-and-deploy:
    needs: test
    runs-on: self-hosted  # Используется GPU-машина с self-hosted runner
    timeout-minutes: 60  # Таймаут для всего job (60 минут)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Полная история для git pull
        clean: false  # Не удалять существующие файлы (избегаем проблем с правами доступа)

    - name: Prepare directories
      run: |
        echo "Подготовка директорий..."
        mkdir -p cache/huggingface models checkpoints db

    - name: Pull latest changes
      run: |
        echo "Обновление кода из репозитория..."
        git fetch origin
        git pull origin main || git pull origin master || git pull origin dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # Укажите вашу версию Python

    - name: Install system dependencies
      run: |
        echo "Проверка системных зависимостей..."
        # Проверяем доступность CUDA
        nvidia-smi || echo "⚠️  nvidia-smi не доступен, будет использоваться CPU"
        # Проверяем Python
        python --version

    - name: Install Python dependencies for CI scripts
      run: |
        echo "Установка минимальных зависимостей для CI/CD скриптов..."
        # Скрипты работают на хосте и взаимодействуют с контейнером через API
        # Обучение происходит внутри контейнера, поэтому на хосте нужны только:
        # - requests (для CVCApiClient)
        # - pyyaml (для чтения config.yaml)
        # - huggingface-hub (для загрузки модели на HF)
        pip install requests pyyaml huggingface-hub

    - name: Check Hugging Face token
      run: |
        if [ -z "${{ secrets.HF_TOKEN }}" ]; then
          echo "⚠️  Предупреждение: HF_TOKEN не установлен в секретах GitHub"
          echo "Модель google/embeddinggemma-300M требует токен Hugging Face"
        else
          echo "✓ HF_TOKEN установлен"
        fi

    - name: Check Docker and docker compose
      run: |
        echo "Проверка Docker..."
        docker --version
        docker compose version
        
        # Проверяем наличие сети (если требуется)
        if ! docker network ls | grep -q robot-services-network; then
          echo "Создание сети robot-services-network..."
          docker network create robot-services-network || true
        fi
        
        # Проверяем доступность CUDA для Docker
        if command -v nvidia-smi &> /dev/null; then
          echo "✓ NVIDIA GPU обнаружен"
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          # Проверяем поддержку NVIDIA Container Runtime
          if docker info | grep -q "nvidia"; then
            echo "✓ NVIDIA Container Runtime доступен"
          else
            echo "⚠️  NVIDIA Container Runtime не настроен, но будет использоваться CUDA версия PyTorch"
          fi
        else
          echo "⚠️  nvidia-smi не доступен, но будет использоваться CUDA версия PyTorch"
        fi
        
        # Проверяем наличие образа (для переиспользования)
        if docker images | grep -q "cvc-api"; then
          echo "ℹ️  Образ cvc-api будет пересобран с CUDA поддержкой"
        else
          echo "ℹ️  Образ cvc-api будет собран с CUDA поддержкой"
        fi

    - name: Run training
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        NUM_ITERATIONS: 20
        NUM_EPOCHS: 1
        BATCH_SIZE: 128
        LEARNING_RATE: 2e-5
        # Путь к базе данных для обучения (по умолчанию: db/training_data_ci.db для CI/CD)
        TRAINING_DB_PATH: ${{ github.event.inputs.db_path || 'db/training_data_ci.db' }}
      run: |
        echo "=========================================="
        echo "Запуск обучения модели"
        echo "=========================================="
        echo "Использование CUDA версии Docker образа..."
        # Удаляем старый контейнер (если есть) для избежания ошибки ContainerConfig
        docker rm -f cvc-api || true
        # Запускаем контейнер с CUDA поддержкой
        # Используем docker-compose.ci.yml для GPU доступа
        docker compose -f docker-compose.yml -f docker-compose.ci.yml build cvc-api
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d cvc-api
        sleep 5
        # Запускаем скрипт внутри Docker контейнера, где есть все зависимости
        docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T \
          -e HF_TOKEN="${HF_TOKEN}" \
          -e NUM_ITERATIONS="${NUM_ITERATIONS}" \
          -e NUM_EPOCHS="${NUM_EPOCHS}" \
          -e BATCH_SIZE="${BATCH_SIZE}" \
          -e LEARNING_RATE="${LEARNING_RATE}" \
          -e TRAINING_DB_PATH="${TRAINING_DB_PATH}" \
          cvc-api python /app/ci/train_via_api.py
        echo "✓ Обучение завершено"

    - name: Upload model to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        echo "=========================================="
        echo "Загрузка модели на Hugging Face Hub"
        echo "=========================================="
        
        if [ -z "$HF_TOKEN" ]; then
          echo "✗ Ошибка: HF_TOKEN не установлен в GitHub Secrets" >&2
          exit 1
        fi
        
        if [ -z "$HF_REPO_ID" ]; then
          echo "✗ Ошибка: HF_REPO_ID не установлен в GitHub Secrets" >&2
          echo "Установите секрет HF_REPO_ID (например: username/model-name)" >&2
          exit 1
        fi
        
        python ci/upload_to_hf.py
        echo "✓ Модель загружена на Hugging Face Hub"

    - name: Cleanup
      if: always()  # Выполняется всегда, даже при ошибке
      run: |
        echo "=========================================="
        echo "Очистка временных файлов"
        echo "=========================================="
        # Останавливаем контейнер, если он был запущен этим job
        docker compose -f docker-compose.yml -f docker-compose.ci.yml down || true
        echo "✓ Очистка завершена"

    - name: Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Итоги выполнения пайплайна"
        echo "=========================================="
        if [ "${{ job.status }}" == "success" ]; then
          echo "✓ Пайплайн выполнен успешно"
          echo "  Модель обучена и загружена на Hugging Face Hub"
          echo "  Репозиторий: https://huggingface.co/${{ secrets.HF_REPO_ID }}"
        else
          echo "✗ Пайплайн завершился с ошибкой"
          echo "  Проверьте логи выше для деталей"
        fi
