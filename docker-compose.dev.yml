# Dev-образ для линта и тестов (линт + pytest в одном окружении)
services:
  cvc-dev:
    image: cvc-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_REPO_ID=${HF_REPO_ID}
    networks:
      - robot-services-network

networks:
  robot-services-network:
    external: true
