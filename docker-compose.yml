# Данные (модели, БД, HF-кэш) — именованные тома, не bind-mount из репозитория.
# Код и config — в образе. В CI: RUNNER_UID/RUNNER_GID для прав на томах при user:.
services:
  cvc-api:
    image: cvc-api
    build:
      context: .
      dockerfile: Dockerfile
    user: "${RUNNER_UID:-0}:${RUNNER_GID:-0}"
    container_name: cvc-api
    ports:
      - "20001:20001"
    volumes:
      - cvc_models:/app/models
      - cvc_hf_cache:/app/.cache/huggingface
      - cvc_db:/app/db
    environment:
      - HF_HOME=/app/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_REPO_ID=${HF_REPO_ID}
    restart: unless-stopped
    networks:
      - robot-services-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:20001/v1/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cvc_models:
  cvc_hf_cache:
  cvc_db:

networks:
  robot-services-network:
    external: true
