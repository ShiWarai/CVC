version: '3.8'

services:
  cvc-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cvc-api
    ports:
      - "20001:20001"
    volumes:
      # Монтируем модели, чтобы они сохранялись между перезапусками
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
      # Монтируем кэш Hugging Face, чтобы не скачивать оригинальную модель каждый раз
      - ./cache/huggingface:/app/.cache/huggingface
      # Монтируем директорию для базы данных (монтирование файла может создать директорию вместо файла)
      - ./db:/app/db
      # Монтируем конфигурацию (опционально, для изменения без пересборки)
      - ./config.yaml:/app/config.yaml:ro
      # Монтируем данные (опционально)
      - ./data:/app/data:ro
    environment:
      # Переменные окружения для Hugging Face
      - HF_HOME=/app/.cache/huggingface
      # Токен для доступа к gated моделям (загружается из .env файла)
      - HF_TOKEN=${HF_TOKEN}
      # Альтернативное имя переменной (на случай если используется другое)
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:20001/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

