services:
  cvc-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cvc-api
    ports:
      - "20001:20001"
    volumes:
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
      - ./cache/huggingface:/app/.cache/huggingface
      - ./db:/app/db
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data:ro
      - ./ci:/app/ci:ro
    environment:
      - HF_HOME=/app/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_REPO_ID=${HF_REPO_ID}
    restart: unless-stopped
    networks:
      - robot-services-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:20001/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  robot-services-network:
    driver: bridge
